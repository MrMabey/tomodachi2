<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tomo Face Simulator - ESP32 Preview</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #0f1621, #1a1a2e);
            font-family: 'Monaco', 'Courier New', monospace;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: flex-start;
        }

        .display-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        #canvas {
            border-radius: 50%;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
            background: #0f1621;
        }

        .controls {
            background: rgba(255, 255, 255, 0.05);
            padding: 25px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 300px;
        }

        h1 {
            margin: 0 0 10px 0;
            font-size: 24px;
            color: #4A90E2;
        }

        .subtitle {
            margin: 0 0 20px 0;
            font-size: 12px;
            color: #888;
        }

        .mood-btn {
            width: 100%;
            padding: 12px;
            margin: 5px 0;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            font-size: 14px;
            transition: all 0.3s;
        }

        .mood-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .mood-btn.active {
            border-color: #4A90E2;
            background: rgba(74, 144, 226, 0.3);
            box-shadow: 0 0 20px rgba(74, 144, 226, 0.5);
        }

        .stats {
            margin-top: 20px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            font-size: 12px;
            line-height: 1.8;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
        }

        .stat-label {
            color: #888;
        }

        .stat-value {
            color: #4A90E2;
            font-weight: bold;
        }

        .emoji {
            font-size: 24px;
            display: inline-block;
            margin-right: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="display-container">
            <canvas id="canvas" width="360" height="360"></canvas>
            <div style="text-align: center;">
                <div style="font-size: 18px; color: #4A90E2;">Waveshare ESP32-S3 Knob</div>
                <div style="font-size: 12px; color: #666;">360x360 Round Display Simulator</div>
            </div>
        </div>

        <div class="controls">
            <h1>🤖 Tomo Face Simulator</h1>
            <div class="subtitle">Click moods to preview animations</div>

            <button class="mood-btn active" data-mood="0">
                <span class="emoji">🔵</span> (o_o) Focused
            </button>
            <button class="mood-btn" data-mood="1">
                <span class="emoji">🟣</span> (^-^) Creative
            </button>
            <button class="mood-btn" data-mood="2">
                <span class="emoji">🟢</span> (^_~) Helpful
            </button>
            <button class="mood-btn" data-mood="3">
                <span class="emoji">🔵</span> (◉_◉) Listening
            </button>
            <button class="mood-btn" data-mood="4">
                <span class="emoji">🟡</span> (º_º) Thinking
            </button>
            <button class="mood-btn" data-mood="5">
                <span class="emoji">🟢</span> (^_^)b Success
            </button>
            <button class="mood-btn" data-mood="6">
                <span class="emoji">🔴</span> (×_×) Error
            </button>
            <button class="mood-btn" data-mood="7">
                <span class="emoji">⚫</span> (-_-) Sleeping
            </button>
            <button class="mood-btn" data-mood="8">
                <span class="emoji">🟣</span> (→_→) Phone Home
            </button>

            <div class="stats">
                <div class="stat-row">
                    <span class="stat-label">Current Mood:</span>
                    <span class="stat-value" id="currentMood">Focused</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Frame Count:</span>
                    <span class="stat-value" id="frameCount">0</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Blink State:</span>
                    <span class="stat-value" id="blinkState">0%</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">FPS:</span>
                    <span class="stat-value" id="fps">60</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Canvas setup
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // Constants (matching Arduino code)
        const SCREEN_WIDTH = 360;
        const SCREEN_HEIGHT = 360;
        const FACE_CENTER_X = SCREEN_WIDTH / 2;
        const FACE_CENTER_Y = SCREEN_HEIGHT / 2;

        const LEFT_EYE_X = 120;
        const LEFT_EYE_Y = 140;
        const RIGHT_EYE_X = 240;
        const RIGHT_EYE_Y = 140;

        const EYE_OUTER_RADIUS = 30;
        const IRIS_RADIUS = 20;
        const PUPIL_RADIUS = 10;

        const MOUTH_X = FACE_CENTER_X;
        const MOUTH_Y = 240;

        // Mood colors (matching Arduino)
        const MOOD_COLORS = [
            '#4A90E2', // Focused - Blue
            '#A78BFA', // Creative - Purple
            '#10B981', // Helpful - Green
            '#06B6D4', // Listening - Cyan
            '#F59E0B', // Thinking - Yellow
            '#22C55E', // Success - Bright green
            '#EF4444', // Error - Red
            '#6B7280', // Sleeping - Gray
            '#EC4899'  // Phone Home - Magenta
        ];

        const MOOD_NAMES = [
            'Focused', 'Creative', 'Helpful', 'Listening',
            'Thinking', 'Success', 'Error', 'Sleeping', 'Phone Home'
        ];

        // Face state
        let faceState = {
            currentMood: 0,
            irisColor: MOOD_COLORS[0],
            blinkProgress: 0.0,
            lastBlinkTime: Date.now(),
            pupilOffsetX: 0.0,
            pupilOffsetY: 0.0,
            eyesSquinted: false,
            rightEyeWink: false,
            showThinkingSpinner: false,
            frameCount: 0
        };

        // FPS tracking
        let lastFrameTime = Date.now();
        let fps = 60;

        // Helper functions
        function easeInOutSine(t) {
            return -(Math.cos(Math.PI * t) - 1) / 2;
        }

        function setMood(moodIndex) {
            faceState.currentMood = moodIndex;
            faceState.irisColor = MOOD_COLORS[moodIndex];

            // Reset flags
            faceState.eyesSquinted = false;
            faceState.rightEyeWink = false;
            faceState.showThinkingSpinner = false;
            faceState.pupilOffsetX = 0.0;
            faceState.pupilOffsetY = 0.0;

            // Set mood-specific flags
            switch(moodIndex) {
                case 1: // Creative
                    faceState.eyesSquinted = true;
                    break;
                case 2: // Helpful
                    faceState.rightEyeWink = true;
                    break;
                case 4: // Thinking
                    faceState.showThinkingSpinner = true;
                    faceState.pupilOffsetY = -0.5;
                    faceState.pupilOffsetX = 0.5;
                    break;
                case 8: // Phone Home
                    faceState.pupilOffsetX = 1.0;
                    break;
            }

            // Update UI
            document.getElementById('currentMood').textContent = MOOD_NAMES[moodIndex];
            document.querySelectorAll('.mood-btn').forEach((btn, idx) => {
                btn.classList.toggle('active', idx === moodIndex);
            });
        }

        // Drawing functions
        function drawEye(centerX, centerY, isWinking) {
            let eyelidClose = EYE_OUTER_RADIUS * faceState.blinkProgress;

            if (isWinking) {
                eyelidClose = EYE_OUTER_RADIUS;
            }

            if (faceState.eyesSquinted && !isWinking) {
                eyelidClose = EYE_OUTER_RADIUS * 0.4;
            }

            // Draw white sclera
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.ellipse(
                centerX,
                centerY,
                EYE_OUTER_RADIUS,
                EYE_OUTER_RADIUS - eyelidClose,
                0, 0, Math.PI * 2
            );
            ctx.fill();

            // If fully closed, skip iris/pupil
            if (eyelidClose >= EYE_OUTER_RADIUS) {
                return;
            }

            // Draw colored iris
            let irisX = centerX + (faceState.pupilOffsetX * 8);
            let irisY = centerY + (faceState.pupilOffsetY * 8);

            ctx.fillStyle = faceState.irisColor;
            ctx.beginPath();
            ctx.arc(irisX, irisY, IRIS_RADIUS, 0, Math.PI * 2);
            ctx.fill();

            // Draw black pupil
            ctx.fillStyle = 'black';
            ctx.beginPath();
            ctx.arc(irisX, irisY, PUPIL_RADIUS, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawMouth() {
            ctx.strokeStyle = 'white';
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';

            ctx.beginPath();
            if (faceState.currentMood === 5 || faceState.currentMood === 1) {
                // Smile
                ctx.moveTo(MOUTH_X - 30, MOUTH_Y);
                ctx.quadraticCurveTo(MOUTH_X, MOUTH_Y + 20, MOUTH_X + 30, MOUTH_Y);
            } else if (faceState.currentMood === 6) {
                // Frown
                ctx.moveTo(MOUTH_X - 30, MOUTH_Y + 15);
                ctx.quadraticCurveTo(MOUTH_X, MOUTH_Y - 5, MOUTH_X + 30, MOUTH_Y + 15);
            } else {
                // Line
                ctx.moveTo(MOUTH_X - 25, MOUTH_Y);
                ctx.lineTo(MOUTH_X + 25, MOUTH_Y);
            }
            ctx.stroke();
        }

        function drawThinkingSpinner() {
            if (!faceState.showThinkingSpinner) return;

            let spinnerRadius = 60;
            let angle = faceState.frameCount * 0.1;

            ctx.fillStyle = '#F59E0B';

            for (let i = 0; i < 3; i++) {
                let dotAngle = angle + (i * 2.0 * Math.PI / 3.0);
                let dotX = FACE_CENTER_X + Math.cos(dotAngle) * spinnerRadius;
                let dotY = 80 + Math.sin(dotAngle) * 20;

                ctx.beginPath();
                ctx.arc(dotX, dotY, 6, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function drawFace() {
            // Clear canvas (dark background)
            ctx.fillStyle = '#0f1621';
            ctx.fillRect(0, 0, SCREEN_WIDTH, SCREEN_HEIGHT);

            // Draw thinking spinner
            drawThinkingSpinner();

            // Draw eyes
            drawEye(LEFT_EYE_X, LEFT_EYE_Y, false);
            drawEye(RIGHT_EYE_X, RIGHT_EYE_Y, faceState.rightEyeWink);

            // Draw mouth
            drawMouth();
        }

        // Animation update
        function updateBlinkAnimation() {
            let currentTime = Date.now();
            let timeSinceBlink = currentTime - faceState.lastBlinkTime;

            // Random blink interval (3-5 seconds)
            if (timeSinceBlink > (3000 + Math.random() * 2000) && faceState.blinkProgress === 0.0) {
                faceState.lastBlinkTime = currentTime;
            }

            let blinkPhase = currentTime - faceState.lastBlinkTime;

            if (blinkPhase < 150) {
                // Closing
                faceState.blinkProgress = easeInOutSine(blinkPhase / 150.0);
            } else if (blinkPhase < 300) {
                // Opening
                faceState.blinkProgress = easeInOutSine(1.0 - ((blinkPhase - 150) / 150.0));
            } else {
                faceState.blinkProgress = 0.0;
            }
        }

        // Main animation loop
        function animate() {
            updateBlinkAnimation();
            drawFace();

            faceState.frameCount++;

            // Update stats
            document.getElementById('frameCount').textContent = faceState.frameCount;
            document.getElementById('blinkState').textContent =
                Math.round(faceState.blinkProgress * 100) + '%';

            // Calculate FPS
            let now = Date.now();
            let delta = now - lastFrameTime;
            fps = Math.round(1000 / delta);
            document.getElementById('fps').textContent = fps;
            lastFrameTime = now;

            requestAnimationFrame(animate);
        }

        // Event listeners
        document.querySelectorAll('.mood-btn').forEach((btn, index) => {
            btn.addEventListener('click', () => setMood(index));
        });

        // Start animation
        animate();
    </script>
</body>
</html>
