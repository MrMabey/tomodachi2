<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Prompt Sidebar - Liquid Glassmorphism</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Animated background blobs for liquid effect */
        .bg-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(40px);
            opacity: 0.7;
            animation: float 20s infinite ease-in-out;
        }

        .bg-blob:nth-child(1) {
            width: 300px;
            height: 300px;
            background: linear-gradient(180deg, #ff6b6b 0%, #ffd93d 100%);
            left: -150px;
            top: -150px;
            animation-delay: 0s;
        }

        .bg-blob:nth-child(2) {
            width: 400px;
            height: 400px;
            background: linear-gradient(180deg, #6bcf7f 0%, #4ecdc4 100%);
            left: 100px;
            bottom: -200px;
            animation-delay: 5s;
        }

        .bg-blob:nth-child(3) {
            width: 250px;
            height: 250px;
            background: linear-gradient(180deg, #a855f7 0%, #ec4899 100%);
            left: 50px;
            top: 50%;
            animation-delay: 10s;
        }

        @keyframes float {
            0%, 100% {
                transform: translate(0, 0) rotate(0deg);
            }
            33% {
                transform: translate(30px, -30px) rotate(120deg);
            }
            66% {
                transform: translate(-20px, 20px) rotate(240deg);
            }
        }

        /* Sidebar container */
        .sidebar {
            position: fixed;
            left: 20px;
            top: 20px;
            bottom: 20px;
            width: 400px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 
                0 20px 40px rgba(0, 0, 0, 0.1),
                inset 0 0 20px rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Messages container */
        .messages-container {
            flex: 1;
            position: relative;
            overflow: hidden;
            padding: 20px;
        }

        /* Message bubble */
        .message {
            position: absolute;
            left: 20px;
            right: 20px;
            padding: 12px 18px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.4;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            animation: slideUp 0.6s ease-out;
            max-width: calc(100% - 40px);
            word-wrap: break-word;
        }

        .message.prompt {
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.9) 0%, rgba(109, 40, 217, 0.9) 100%);
            color: white;
            align-self: flex-end;
            box-shadow: 
                0 10px 30px rgba(139, 92, 246, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        .message.response {
            background: rgba(255, 255, 255, 0.15);
            color: white;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 
                0 10px 30px rgba(0, 0, 0, 0.1),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .message.fading {
            opacity: 0;
            transform: translateY(-20px);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Pump bar container */
        .pump-bar-container {
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Input group */
        .input-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .prompt-input {
            flex: 1;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 12px 16px;
            color: white;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        .prompt-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .prompt-input:focus {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(139, 92, 246, 0.5);
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.2);
        }

        /* Pump button */
        .pump-button {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: linear-gradient(135deg, #8b5cf6 0%, #6d28d9 100%);
            border: none;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .pump-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(139, 92, 246, 0.4);
        }

        .pump-button:active {
            transform: scale(0.95);
        }

        .pump-button.pumping {
            animation: pump 0.6s ease-out;
        }

        @keyframes pump {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.2);
            }
            100% {
                transform: scale(1);
            }
        }

        /* Ripple effect */
        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.5);
            transform: scale(0);
            animation: ripple 0.6s ease-out;
        }

        @keyframes ripple {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        /* Loading dots */
        .loading-dots {
            display: inline-flex;
            gap: 4px;
        }

        .loading-dots span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.6);
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .loading-dots span:nth-child(1) {
            animation-delay: -0.32s;
        }

        .loading-dots span:nth-child(2) {
            animation-delay: -0.16s;
        }

        @keyframes bounce {
            0%, 80%, 100% {
                transform: scale(0);
            }
            40% {
                transform: scale(1);
            }
        }
    </style>
</head>
<body>
    <!-- Animated background blobs -->
    <div class="bg-blob"></div>
    <div class="bg-blob"></div>
    <div class="bg-blob"></div>

    <!-- Sidebar -->
    <div class="sidebar">
        <!-- Messages container -->
        <div class="messages-container" id="messagesContainer"></div>

        <!-- Pump bar -->
        <div class="pump-bar-container">
            <div class="input-group">
                <input 
                    type="text" 
                    class="prompt-input" 
                    id="promptInput" 
                    placeholder="Enter your prompt..."
                    autocomplete="off"
                >
                <button class="pump-button" id="pumpButton">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        class AIPromptSidebar {
            constructor() {
                this.messagesContainer = document.getElementById('messagesContainer');
                this.promptInput = document.getElementById('promptInput');
                this.pumpButton = document.getElementById('pumpButton');
                this.messages = [];
                this.messageHeight = 60; // Approximate height for positioning
                this.middlePosition = this.messagesContainer.clientHeight / 2;
                
                this.init();
            }

            init() {
                // Bind events
                this.pumpButton.addEventListener('click', () => this.sendPrompt());
                this.promptInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        this.sendPrompt();
                    }
                });

                // Add ripple effect to pump button
                this.pumpButton.addEventListener('click', (e) => {
                    const ripple = document.createElement('span');
                    ripple.classList.add('ripple');
                    const rect = this.pumpButton.getBoundingClientRect();
                    const size = 20;
                    ripple.style.width = ripple.style.height = size + 'px';
                    ripple.style.left = e.clientX - rect.left - size / 2 + 'px';
                    ripple.style.top = e.clientY - rect.top - size / 2 + 'px';
                    this.pumpButton.appendChild(ripple);
                    setTimeout(() => ripple.remove(), 600);
                });
            }

            sendPrompt() {
                const text = this.promptInput.value.trim();
                if (!text) return;

                // Pump animation
                this.pumpButton.classList.add('pumping');
                setTimeout(() => this.pumpButton.classList.remove('pumping'), 600);

                // Create prompt message
                this.createMessage(text, 'prompt');
                
                // Clear input
                this.promptInput.value = '';

                // Simulate AI response after delay
                setTimeout(() => {
                    this.simulateResponse();
                }, 1000 + Math.random() * 1000);
            }

            createMessage(text, type) {
                const message = document.createElement('div');
                message.classList.add('message', type);
                message.textContent = text;
                
                // Add to container
                this.messagesContainer.appendChild(message);
                
                // Store message data
                const messageData = {
                    element: message,
                    timestamp: Date.now(),
                    type: type
                };
                this.messages.push(messageData);

                // Position message
                this.positionMessages();

                // Check for old messages to fade
                this.fadeOldMessages();
            }

            positionMessages() {
                const containerHeight = this.messagesContainer.clientHeight;
                const middleY = containerHeight / 2;
                
                this.messages.forEach((msg, index) => {
                    const fromBottom = this.messages.length - index - 1;
                    let targetY;
                    
                    if (fromBottom === 0) {
                        // Most recent message starts near middle
                        targetY = middleY - 30;
                    } else {
                        // Stack messages upward from the most recent
                        const previousMsg = this.messages[index + 1];
                        const previousRect = previousMsg.element.getBoundingClientRect();
                        const containerRect = this.messagesContainer.getBoundingClientRect();
                        const previousY = previousRect.top - containerRect.top;
                        targetY = previousY - previousRect.height - 15; // 15px gap between messages
                    }
                    
                    // Apply position
                    msg.element.style.top = `${targetY}px`;
                    
                    // Calculate opacity based on position
                    const fadeZone = 100; // Top 100px is fade zone
                    if (targetY < fadeZone) {
                        const opacity = Math.max(0, targetY / fadeZone);
                        msg.element.style.opacity = opacity;
                        
                        // Remove if completely faded
                        if (opacity <= 0) {
                            msg.element.classList.add('fading');
                        }
                    } else {
                        msg.element.style.opacity = 1;
                    }
                });
            }

            fadeOldMessages() {
                // Remove messages that have faded out
                this.messages = this.messages.filter(msg => {
                    if (msg.element.classList.contains('fading')) {
                        setTimeout(() => msg.element.remove(), 600);
                        return false;
                    }
                    return true;
                });
            }

            simulateResponse() {
                // Create loading message first
                const loadingDiv = document.createElement('div');
                loadingDiv.classList.add('message', 'response');
                loadingDiv.innerHTML = '<div class="loading-dots"><span></span><span></span><span></span></div>';
                this.messagesContainer.appendChild(loadingDiv);
                
                const loadingMsg = {
                    element: loadingDiv,
                    timestamp: Date.now(),
                    type: 'response'
                };
                this.messages.push(loadingMsg);
                this.positionMessages();

                // Replace with actual response after delay
                setTimeout(() => {
                    const responses = [
                        "Processing your request with advanced neural pathways...",
                        "Analyzing patterns and generating optimal response...",
                        "Synthesizing information from multiple knowledge domains...",
                        "Quantum computing engaged. Response formulating...",
                        "Neural network consensus achieved. Here's what I found...",
                        "Deep learning models have processed your query...",
                        "Algorithmic optimization complete. Response ready...",
                        "Machine learning models have analyzed your input..."
                    ];
                    
                    const responseText = responses[Math.floor(Math.random() * responses.length)];
                    loadingDiv.textContent = responseText;
                    this.positionMessages();
                }, 800);
            }
        }

        // Initialize when DOM is ready
        document.addEventListener('DOMContentLoaded', () => {
            new AIPromptSidebar();
        });
    </script>
</body>
</html>
