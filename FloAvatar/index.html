<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FloAvatar Demo</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: white;
        }
        .demo-content {
            max-width: 600px;
            margin: 0 auto;
            text-align: center;
            padding: 20px;
        }
        .instructions {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
        }
        button {
            background: #FFB6C1;
            color: #333;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            margin: 10px;
        }
        button:hover {
            background: #FF91A4;
        }
    </style>
</head>
<body>
    <div class="demo-content">
        <h1>🌸 FloAvatar Demo</h1>
        <div class="instructions">
            <p>Click "Launch Avatar" to start your floating companion!</p>
            <p>• Click the avatar to make it happy</p>
            <p>• Watch it move around with personality</p>
            <p>• It will blink, change expressions, and pause to "think"</p>
        </div>
        <button onclick="launchAvatar()">Launch Avatar</button>
        <button onclick="removeAvatar()">Remove Avatar</button>
    </div>

    <!-- React and ReactDOM from CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- Avatar implementation -->
    <script>
        // Convert the TSX to vanilla JavaScript/React
        const { useState, useEffect, useCallback } = React;
        const { createRoot } = ReactDOM;

        function FloAvatar({ onInteract }) {
            const [position, setPosition] = useState({ 
                x: window.innerWidth / 2, 
                y: window.innerHeight / 2 
            });
            const [velocity, setVelocity] = useState({ x: 1.5, y: 1 });
            const [expression, setExpression] = useState('normal');
            const [isBlinking, setIsBlinking] = useState(false);
            const [isOffScreen, setIsOffScreen] = useState(false);
            const [scale, setScale] = useState(1);
            const [curiosityMode, setCuriosityMode] = useState(false);
            const [pauseTimer, setPauseTimer] = useState(0);

            // Random expression changes
            useEffect(() => {
                const expressionInterval = setInterval(() => {
                    const expressions = ['normal', 'happy', 'sleepy'];
                    const randomExpression = expressions[Math.floor(Math.random() * expressions.length)];
                    setExpression(randomExpression);
                }, 4000 + Math.random() * 6000);

                return () => clearInterval(expressionInterval);
            }, []);

            // Blinking animation
            useEffect(() => {
                const blinkInterval = setInterval(() => {
                    setIsBlinking(true);
                    setTimeout(() => setIsBlinking(false), 150);
                }, 2000 + Math.random() * 3000);

                return () => clearInterval(blinkInterval);
            }, []);

            // Curiosity mode
            useEffect(() => {
                const curiosityInterval = setInterval(() => {
                    if (Math.random() < 0.3) {
                        setCuriosityMode(true);
                        setExpression('happy');
                        
                        setVelocity(prev => ({
                            x: (Math.random() - 0.5) * 3,
                            y: (Math.random() - 0.5) * 3
                        }));
                        
                        setTimeout(() => setCuriosityMode(false), 2000);
                    }
                }, 5000 + Math.random() * 5000);

                return () => clearInterval(curiosityInterval);
            }, []);

            // Random pauses
            useEffect(() => {
                const pauseInterval = setInterval(() => {
                    if (Math.random() < 0.2) {
                        setPauseTimer(1000 + Math.random() * 2000);
                        setExpression('sleepy');
                    }
                }, 8000 + Math.random() * 7000);

                return () => clearInterval(pauseInterval);
            }, []);

            // Floating animation
            useEffect(() => {
                const animationFrame = setInterval(() => {
                    setPauseTimer(prev => Math.max(0, prev - 16));
                    
                    setPosition(prevPos => {
                        if (pauseTimer > 0) {
                            return prevPos;
                        }

                        let newX = prevPos.x + velocity.x;
                        let newY = prevPos.y + velocity.y;
                        let newVelocityX = velocity.x;
                        let newVelocityY = velocity.y;

                        const avatarSize = 60;
                        const margin = 100;

                        // Screen boundaries and off-screen floating
                        if (newX > window.innerWidth + margin) {
                            newX = -margin;
                            newY = Math.random() * (window.innerHeight - avatarSize);
                            setIsOffScreen(true);
                            setTimeout(() => setIsOffScreen(false), 1500);
                        } else if (newX < -margin) {
                            newX = window.innerWidth + margin;
                            newY = Math.random() * (window.innerHeight - avatarSize);
                            setIsOffScreen(true);
                            setTimeout(() => setIsOffScreen(false), 1500);
                        }

                        if (newY > window.innerHeight + margin) {
                            newY = -margin;
                            newX = Math.random() * (window.innerWidth - avatarSize);
                            setIsOffScreen(true);
                            setTimeout(() => setIsOffScreen(false), 1500);
                        } else if (newY < -margin) {
                            newY = window.innerHeight + margin;
                            newX = Math.random() * (window.innerWidth - avatarSize);
                            setIsOffScreen(true);
                            setTimeout(() => setIsOffScreen(false), 1500);
                        }

                        // Bounce off visible screen edges
                        if (newX >= window.innerWidth - avatarSize && newX <= window.innerWidth) {
                            newVelocityX = -Math.abs(velocity.x) * (0.8 + Math.random() * 0.4);
                            if (Math.random() < 0.3) setExpression('happy');
                        } else if (newX <= 0 && newX >= -avatarSize) {
                            newVelocityX = Math.abs(velocity.x) * (0.8 + Math.random() * 0.4);
                            if (Math.random() < 0.3) setExpression('happy');
                        }

                        if (newY >= window.innerHeight - avatarSize && newY <= window.innerHeight) {
                            newVelocityY = -Math.abs(velocity.y) * (0.8 + Math.random() * 0.4);
                            if (Math.random() < 0.3) setExpression('happy');
                        } else if (newY <= 0 && newY >= -avatarSize) {
                            newVelocityY = Math.abs(velocity.y) * (0.8 + Math.random() * 0.4);
                            if (Math.random() < 0.3) setExpression('happy');
                        }

                        // Add personality to movement
                        if (!curiosityMode) {
                            if (Math.random() < 0.05) {
                                newVelocityX += (Math.random() - 0.5) * 0.5;
                                newVelocityY += (Math.random() - 0.5) * 0.5;
                            }
                            
                            if (Math.random() < 0.02) {
                                const centerX = window.innerWidth / 2;
                                const centerY = window.innerHeight / 2;
                                if (prevPos.x > centerX) newVelocityX -= 0.1;
                                if (prevPos.x < centerX) newVelocityX += 0.1;
                                if (prevPos.y > centerY) newVelocityY -= 0.1;
                                if (prevPos.y < centerY) newVelocityY += 0.1;
                            }
                        }

                        newVelocityX = Math.max(-2.5, Math.min(2.5, newVelocityX));
                        newVelocityY = Math.max(-2.5, Math.min(2.5, newVelocityY));

                        setVelocity({ x: newVelocityX, y: newVelocityY });

                        return { x: newX, y: newY };
                    });
                }, 16);

                return () => clearInterval(animationFrame);
            }, [velocity, curiosityMode, pauseTimer]);

            const handleMouseEnter = useCallback(() => {
                setScale(1.1);
                setExpression('happy');
            }, []);

            const handleMouseLeave = useCallback(() => {
                setScale(1);
            }, []);

            const handleClick = useCallback(() => {
                setExpression('happy');
                setScale(1.2);
                setTimeout(() => setScale(1), 200);
                onInteract?.();
            }, [onInteract]);

            const showMouth = expression === 'happy';

            return React.createElement('div', {
                className: `flo-avatar ${isOffScreen ? 'off-screen' : ''} ${expression}`,
                style: {
                    left: position.x,
                    top: position.y,
                    transform: `scale(${scale})`,
                },
                onMouseEnter: handleMouseEnter,
                onMouseLeave: handleMouseLeave,
                onClick: handleClick
            }, 
                React.createElement('div', { className: 'flo-body' },
                    React.createElement('div', { className: 'flo-ear left-ear' }),
                    React.createElement('div', { className: 'flo-ear right-ear' }),
                    React.createElement('div', { 
                        className: `flo-eye left-eye ${isBlinking ? 'blink' : ''}` 
                    }),
                    React.createElement('div', { 
                        className: `flo-eye right-eye ${isBlinking ? 'blink' : ''} ${expression === 'sleepy' ? 'sleepy' : ''}` 
                    }),
                    showMouth && React.createElement('div', { className: 'flo-mouth' })
                )
            );
        }

        let avatarRoot = null;

        function launchAvatar() {
            // Remove existing avatar if any
            removeAvatar();
            
            // Create container
            const container = document.createElement('div');
            container.id = 'flo-avatar-container';
            container.style.cssText = `
                position: fixed;
                top: 0;
                left: 0;
                z-index: 999997;
                pointer-events: none;
                width: 100vw;
                height: 100vh;
            `;
            
            document.body.appendChild(container);
            
            // Render React component
            avatarRoot = createRoot(container);
            avatarRoot.render(
                React.createElement(FloAvatar, {
                    onInteract: () => {
                        console.log('Flo avatar clicked!');
                        // Add some feedback
                        const feedback = document.createElement('div');
                        feedback.textContent = '✨ Hello!';
                        feedback.style.cssText = `
                            position: fixed;
                            top: 50%;
                            left: 50%;
                            transform: translate(-50%, -50%);
                            background: rgba(255, 182, 193, 0.9);
                            color: #333;
                            padding: 10px 20px;
                            border-radius: 20px;
                            font-weight: bold;
                            z-index: 999999;
                            pointer-events: none;
                        `;
                        document.body.appendChild(feedback);
                        setTimeout(() => feedback.remove(), 2000);
                    }
                })
            );
        }

        function removeAvatar() {
            const container = document.getElementById('flo-avatar-container');
            if (container) {
                if (avatarRoot) {
                    avatarRoot.unmount();
                    avatarRoot = null;
                }
                container.remove();
            }
        }
    </script>

    <style>
        /* Include the CSS from FloAvatar.css */
        .flo-avatar {
            position: fixed;
            width: 60px;
            height: 60px;
            z-index: 999998;
            cursor: pointer;
            transition: transform 0.2s ease;
            user-select: none;
            pointer-events: auto;
        }

        .flo-avatar.off-screen {
            opacity: 0.4;
            transition: opacity 0.5s ease;
        }

        .flo-body {
            position: relative;
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #A78BFA 0%, #EC4899 100%);
            border-radius: 50%;
            border: 2px solid #8B5CF6;
            animation: float 4s ease-in-out infinite;
            left: 5px;
            top: 10px;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
        }

        .flo-ear {
            position: absolute;
            width: 14px;
            height: 16px;
            background: linear-gradient(135deg, #A78BFA 0%, #EC4899 100%);
            border-radius: 70% 70% 50% 50%;
            border: 2px solid #8B5CF6;
            top: -6px;
            box-shadow: 0 2px 8px rgba(139, 92, 246, 0.2);
            z-index: -1;
        }

        .left-ear {
            left: 5px;
            transform: rotate(-25deg);
        }

        .right-ear {
            right: 5px;
            transform: rotate(25deg);
        }

        .left-ear::after,
        .right-ear::after {
            content: '';
            position: absolute;
            left: 2px;
            top: 3px;
            width: 8px;
            height: 9px;
            background: linear-gradient(135deg, #DDD6FE 0%, #FBBF24 100%);
            border-radius: 60% 60% 40% 40%;
        }

        .flo-eye {
            position: absolute;
            width: 6px;
            height: 8px;
            background: #333;
            border-radius: 50%;
            top: 16px;
            transition: all 0.3s ease;
        }

        .flo-eye::after {
            content: '';
            position: absolute;
            top: 1px;
            left: 1px;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            opacity: 0.8;
        }

        .left-eye {
            left: 13px;
        }

        .right-eye {
            right: 13px;
        }

        .flo-eye.blink {
            height: 2px;
            border-radius: 50%;
            transform: scaleY(0.3);
        }

        .flo-eye.sleepy {
            height: 5px;
            transform: scaleY(0.6);
        }

        .flo-eye.sleepy::after {
            opacity: 0.4;
        }

        .flo-mouth {
            position: absolute;
            top: 28px;
            left: 50%;
            transform: translateX(-50%);
            width: 12px;
            height: 6px;
            border: 1.5px solid #333;
            border-top: none;
            border-radius: 0 0 12px 12px;
        }

        .flo-avatar:hover .flo-body {
            background: linear-gradient(135deg, #C084FC 0%, #F472B6 100%);
            animation-duration: 2s;
            box-shadow: 0 6px 20px rgba(139, 92, 246, 0.4);
        }

        .flo-avatar:hover .flo-ear {
            background: linear-gradient(135deg, #C084FC 0%, #F472B6 100%);
        }

        #flo-avatar-container .flo-avatar {
            pointer-events: auto;
        }
    </style>
</body>
</html>
